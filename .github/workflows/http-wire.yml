name: Real HTTP wire and streaming validation
on:
  push:
    branches: [feature/matrix-84-deep-validation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', symfony: '5.4' }
          - { php: '8.3', symfony: '6.4' }
          - { php: '8.3', symfony: '7.4' }
          - { php: '8.4', symfony: '7.4' }
          - { php: '8.4', symfony: '8.1' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: openssl, mbstring, xml, curl, zip, tokenizer
          coverage: none
      - name: Select Symfony branch on disposable runner
        env:
          SYMFONY_BRANCH: ${{ matrix.symfony }}
        run: |
          php -r '$p=json_decode(file_get_contents("composer.json"),true);foreach($p["require"] as $k=>$v)if(str_starts_with($k,"symfony/"))$p["require"][$k]=getenv("SYMFONY_BRANCH").".*";file_put_contents("composer.json",json_encode($p,JSON_PRETTY_PRINT).PHP_EOL);'
      - run: composer update --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
      - run: php -l bin/wire.php && php -l tests/Wire/router.php
      - name: Real transport checks on localhost (disposable fixtures)
        run: |
          mkdir -p reports
          php bin/wire.php > reports/wire.json
      - name: Upload redacted wire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-wire-php${{ matrix.php }}-symfony${{ matrix.symfony }}
          path: reports/wire.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce all wire checks
        run: |
          php -r '$r=json_decode(file_get_contents("reports/wire.json"),true);if(!is_array($r)||($r["variants"]??0)!==12)exit(2);foreach($r["results"] as $v){echo $v["mode"]." debug=".($v["debug"]?"1":"0")." guarded=".($v["guarded"]?"1":"0")." ".$v["status"]." ".implode("; ",$v["reasons"]).PHP_EOL;}exit(($r["status_counts"]["FAIL"]??0)+($r["status_counts"]["NOT_RUN"]??0)>0?1:0);'

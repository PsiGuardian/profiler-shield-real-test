name: Complete 84-case deep matrix
on:
  push:
    branches: [feature/matrix-84-deep-validation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix84:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', symfony: '5.4' }
          - { php: '8.3', symfony: '6.4' }
          - { php: '8.3', symfony: '7.4' }
          - { php: '8.4', symfony: '7.4' }
          - { php: '8.4', symfony: '8.1' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: openssl, mbstring, xml, curl, zip, tokenizer
          coverage: none
      - name: Pin Symfony branch in disposable CI workspace
        env:
          SYMFONY_BRANCH: ${{ matrix.symfony }}
        run: |
          php -r '$p=json_decode(file_get_contents("composer.json"),true);foreach(["require","require-dev"] as $sec){foreach(($p[$sec]??[]) as $k=>$v){if(str_starts_with($k,"symfony/"))$p[$sec][$k]=getenv("SYMFONY_BRANCH").".*";}}file_put_contents("composer.json",json_encode($p,JSON_PRETTY_PRINT).PHP_EOL);'
      - name: Install release without plugins or scripts
        run: composer update --no-progress --no-interaction --prefer-dist --no-plugins --no-scripts
      - name: Validate PHP fixture source
        run: find tests bin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run complete 84-scenario matrix and write redacted results
        run: |
          mkdir -p reports
          php bin/matrix84.php > reports/matrix84.json
      - name: Publish matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix84-php${{ matrix.php }}-symfony${{ matrix.symfony }}
          path: reports/matrix84.json
          if-no-files-found: warn
          retention-days: 14
      - name: Explain every non-pass scenario and validate report envelope
        run: |
          php -r '$raw=file_get_contents("reports/matrix84.json");$a=json_decode($raw,true);echo "JSON error: ".json_last_error_msg().PHP_EOL;echo "Schema: ".($a["schema"]??"missing")." Scenarios: ".($a["scenarios_declared"]??"missing")." Observed: ".($a["executions_observed"]??"missing").PHP_EOL;foreach(($a["scenario_summary"]??[]) as $r){if($r["aggregate"]==="PASS")continue;$entry=null;foreach(($a["results"]??[]) as $t){if($t["test_id"]===$r["test_id"]&&$t["status"]!=="PASS"){$entry=$t;break;}}echo $r["test_id"]." ".$r["aggregate"]." : ".implode("; ",array_slice(($entry["reasons"]??[]),0,3)).PHP_EOL;}'
      - name: Fail CI on P0 regression or missing test
        run: php bin/gate.php reports/matrix84.json
